[project]
name = "notification-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arun", email = "99788950+ArunK2654@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
notification-service = "notification_service:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "safety>=3.8.1",
    "uvicorn[standard]",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.black]
target-version = ["py312"]
